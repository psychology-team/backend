version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: psychology-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: psychology
      POSTGRES_USER: psychology_user
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
